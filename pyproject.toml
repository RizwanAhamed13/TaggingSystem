[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taggingsystem"
version = "0.1.0"
description = "Non-LLM OCR, tagging, and extractive document description platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
workers = [
  "celery>=5.4.0",
  "redis>=5.0.0"
]
storage = [
  "boto3>=1.34.0",
  "sqlalchemy>=2.0.0",
  "opensearch-py>=2.6.0"
]
ocr = [
  "paddleocr>=2.8.0",
  "pytesseract>=0.3.10",
  "ocrmypdf>=16.4.0",
  "pymupdf>=1.24.0",
  "pdfplumber>=0.11.0",
  "python-doctr>=0.8.0",
  "layoutparser>=0.3.4"
]
ml = [
  "scikit-learn>=1.5.0",
  "fasttext-wheel>=0.9.2",
  "sumy>=0.11.0",
  "spacy>=3.7.0"
]
metrics = [
  "rapidfuzz>=3.9.0",
  "rouge-score>=0.1.2"
]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
